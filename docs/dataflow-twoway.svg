<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 772" width="960" height="772" role="img" aria-labelledby="t d">
  <title id="t">kvm-link two-way pair: how a command travels</title>
  <desc id="d">Each RP2350 board is a USB serial port and a USB keyboard and pointer on its own computer. When computer A drives computer B, kvm.py on A writes a command line to board A's serial port, board A sends it out of GP13, board B receives it on GP9 and turns it into a USB keyboard or pointer report for computer B. Board B then answers out of its own GP13, board A receives the answer on GP9 and hands it to kvm.py. When computer B drives computer A the same happens the other way round, over the same two joints. A jumper wire joins the grounds of the two boards. A board tells the two kinds of line apart by the first character: plus or minus is an answer, anything else is a command.</desc>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5b942"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4cc38a"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .dim { fill: #8b949e; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    .box { fill: #161b22; stroke: #444c56; }
    .board { fill: #17264f; stroke: #3b5bbd; }
    .part { fill: #0d1117; stroke: #586374; }
    .h { font-size: 14px; font-weight: 700; }
    .p { font-size: 11.5px; fill: #e6edf3; }
    .pin { font-size: 10.5px; font-weight: 700; fill: #ffffff; }
    .s { font-size: 11px; fill: #8b949e; }
    .leg { font-size: 12.5px; }
    .pad { fill: #ffd866; stroke: #ffffff; stroke-width: 1.2; }
    .cmd { fill: none; stroke: #f5b942; stroke-width: 2.5; stroke-linejoin: round; }
    .ans { fill: none; stroke: #4cc38a; stroke-width: 2.5; stroke-linejoin: round; }
    .off { opacity: 0.38; }
  </style>

  <rect x="0.5" y="0.5" width="959" height="771" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="44" font-size="20" font-weight="700">Two-way pair: how a command travels</text>
  <text x="60" y="66" font-size="12.5" class="dim">Each board is a serial port and a keyboard plus pointer on its own computer. <tspan fill="#f5b942" font-weight="700">Commands</tspan> go one way and <tspan fill="#4cc38a" font-weight="700">answers</tspan> come back.</text>
  <text x="60" y="100" class="h">Computer A drives computer B</text>
  <rect class="box" x="30" y="116" width="170" height="190" rx="10"/>
  <text class="h" x="115" y="142" text-anchor="middle">Computer A</text>
  <rect class="box" x="760" y="116" width="170" height="190" rx="10"/>
  <text class="h" x="845" y="142" text-anchor="middle">Computer B</text>
  <g>
    <rect class="part" x="45" y="166" width="140" height="44" rx="6"/>
    <text class="p mono" x="115.0" y="185" text-anchor="middle">kvm.py</text>
    <text class="s" x="115.0" y="199" text-anchor="middle">writes to the COM port</text>
  </g>
  <g class="off">
    <rect class="part" x="45" y="242" width="140" height="44" rx="6"/>
    <text class="p" x="115.0" y="261" text-anchor="middle">gets key presses</text>
    <text class="s" x="115.0" y="275" text-anchor="middle">and pointer moves</text>
  </g>
  <g class="off">
    <rect class="part" x="775" y="166" width="140" height="44" rx="6"/>
    <text class="p mono" x="845.0" y="185" text-anchor="middle">kvm.py</text>
    <text class="s" x="845.0" y="199" text-anchor="middle">writes to the COM port</text>
  </g>
  <g>
    <rect class="part" x="775" y="242" width="140" height="44" rx="6"/>
    <text class="p" x="845.0" y="261" text-anchor="middle">gets key presses</text>
    <text class="s" x="845.0" y="275" text-anchor="middle">and pointer moves</text>
  </g>
  <rect class="board" x="270" y="116" width="180" height="190" rx="10"/>
  <text class="h" x="360" y="142" text-anchor="middle">Board A</text>
  <rect class="board" x="510" y="116" width="180" height="190" rx="10"/>
  <text class="h" x="600" y="142" text-anchor="middle">Board B</text>
  <g>
    <rect class="part" x="277" y="166" width="110" height="44" rx="6"/>
    <text class="p" x="332.0" y="192" text-anchor="middle">USB serial port</text>
  </g>
  <g class="off">
    <rect class="part" x="277" y="242" width="110" height="44" rx="6"/>
    <text class="p" x="332.0" y="261" text-anchor="middle">USB keyboard</text>
    <text class="p" x="332.0" y="275" text-anchor="middle">and pointer</text>
  </g>
  <g class="off">
    <rect class="part" x="573" y="166" width="110" height="44" rx="6"/>
    <text class="p" x="628.0" y="192" text-anchor="middle">USB serial port</text>
  </g>
  <g>
    <rect class="part" x="573" y="242" width="110" height="44" rx="6"/>
    <text class="p" x="628.0" y="261" text-anchor="middle">USB keyboard</text>
    <text class="p" x="628.0" y="275" text-anchor="middle">and pointer</text>
  </g>
  <text class="s" x="235" y="230" text-anchor="middle">USB</text>
  <text class="s" x="725" y="230" text-anchor="middle">USB</text>
  <text class="s" x="480" y="222" text-anchor="middle">solder</text>
  <text class="s" x="480" y="235" text-anchor="middle">joints</text>
  <text class="pin" x="441" y="178" text-anchor="end">GP9 in</text>
  <text class="pin" x="441" y="282" text-anchor="end">GP13 out</text>
  <text class="pin" x="519" y="178">GP13 out</text>
  <text class="pin" x="519" y="282">GP9 in</text>
  <path class="cmd" d="M187 200H275" marker-end="url(#c)"/>
  <path class="cmd" d="M387 200H425V264H571" marker-end="url(#c)"/>
  <path class="cmd" d="M683 264H773" marker-end="url(#c)"/>
  <path class="ans" d="M628 242V226H540V188H389" marker-end="url(#r)"/>
  <path class="ans" d="M277 178H189" marker-end="url(#r)"/>
  <circle cx="235" cy="200" r="9" fill="#0d1117" stroke="#f5b942" stroke-width="1.8"/>
  <text x="235" y="204" font-size="11" font-weight="700" text-anchor="middle" fill="#f5b942">1</text>
  <circle cx="425" cy="234" r="9" fill="#0d1117" stroke="#f5b942" stroke-width="1.8"/>
  <text x="425" y="238" font-size="11" font-weight="700" text-anchor="middle" fill="#f5b942">2</text>
  <circle cx="540" cy="264" r="9" fill="#0d1117" stroke="#f5b942" stroke-width="1.8"/>
  <text x="540" y="268" font-size="11" font-weight="700" text-anchor="middle" fill="#f5b942">3</text>
  <circle cx="724" cy="264" r="9" fill="#0d1117" stroke="#f5b942" stroke-width="1.8"/>
  <text x="724" y="268" font-size="11" font-weight="700" text-anchor="middle" fill="#f5b942">4</text>
  <circle cx="586" cy="226" r="9" fill="#0d1117" stroke="#4cc38a" stroke-width="1.8"/>
  <text x="586" y="230" font-size="11" font-weight="700" text-anchor="middle" fill="#4cc38a">5</text>
  <circle cx="235" cy="178" r="9" fill="#0d1117" stroke="#4cc38a" stroke-width="1.8"/>
  <text x="235" y="182" font-size="11" font-weight="700" text-anchor="middle" fill="#4cc38a">6</text>
  <path d="M450 292Q480 304 510 292" fill="none" stroke="#d0d7de" stroke-width="3" stroke-linecap="round"/>
  <circle cx="450" cy="292" r="4.5" fill="#ffd866" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="510" cy="292" r="4.5" fill="#ffd866" stroke="#ffffff" stroke-width="1.2"/>
  <text class="s" x="480" y="286" text-anchor="middle" fill="#c9d1d9">GND wire</text>
  <rect class="pad" x="444" y="182" width="12" height="12" rx="3"/>
  <rect class="pad" x="444" y="258" width="12" height="12" rx="3"/>
  <rect class="pad" x="504" y="182" width="12" height="12" rx="3"/>
  <rect class="pad" x="504" y="258" width="12" height="12" rx="3"/>
  <circle cx="70" cy="330" r="9" fill="#0d1117" stroke="#f5b942" stroke-width="1.8"/>
  <text x="70" y="334" font-size="11" font-weight="700" text-anchor="middle" fill="#f5b942">1</text>
  <text class="leg" x="88" y="334">kvm.py writes a command line to board A's serial port, for example <tspan class="mono">K 00 04</tspan> (press the A key).</text>
  <circle cx="70" cy="350" r="9" fill="#0d1117" stroke="#f5b942" stroke-width="1.8"/>
  <text x="70" y="354" font-size="11" font-weight="700" text-anchor="middle" fill="#f5b942">2</text>
  <text class="leg" x="88" y="354">Board A sends the line out of GP13.</text>
  <circle cx="70" cy="370" r="9" fill="#0d1117" stroke="#f5b942" stroke-width="1.8"/>
  <text x="70" y="374" font-size="11" font-weight="700" text-anchor="middle" fill="#f5b942">3</text>
  <text class="leg" x="88" y="374">Board B receives it on GP9 and turns it into a USB keyboard or pointer report.</text>
  <circle cx="70" cy="390" r="9" fill="#0d1117" stroke="#f5b942" stroke-width="1.8"/>
  <text x="70" y="394" font-size="11" font-weight="700" text-anchor="middle" fill="#f5b942">4</text>
  <text class="leg" x="88" y="394">Computer B gets the key press, as it would from any keyboard.</text>
  <circle cx="70" cy="410" r="9" fill="#0d1117" stroke="#4cc38a" stroke-width="1.8"/>
  <text x="70" y="414" font-size="11" font-weight="700" text-anchor="middle" fill="#4cc38a">5</text>
  <text class="leg" x="88" y="414">Once computer B has taken the report, board B answers <tspan class="mono">+</tspan> out of its own GP13.</text>
  <circle cx="70" cy="430" r="9" fill="#0d1117" stroke="#4cc38a" stroke-width="1.8"/>
  <text x="70" y="434" font-size="11" font-weight="700" text-anchor="middle" fill="#4cc38a">6</text>
  <text class="leg" x="88" y="434">Board A receives the answer on GP9 and hands it to kvm.py through the serial port.</text>
  <line x1="60" y1="452" x2="900" y2="452" stroke="#21262d"/>
  <text x="60" y="482" class="h">Computer B drives computer A: the same steps, the other way round</text>
  <rect class="box" x="30" y="498" width="170" height="190" rx="10"/>
  <text class="h" x="115" y="524" text-anchor="middle">Computer A</text>
  <rect class="box" x="760" y="498" width="170" height="190" rx="10"/>
  <text class="h" x="845" y="524" text-anchor="middle">Computer B</text>
  <g class="off">
    <rect class="part" x="45" y="548" width="140" height="44" rx="6"/>
    <text class="p mono" x="115.0" y="567" text-anchor="middle">kvm.py</text>
    <text class="s" x="115.0" y="581" text-anchor="middle">writes to the COM port</text>
  </g>
  <g>
    <rect class="part" x="45" y="624" width="140" height="44" rx="6"/>
    <text class="p" x="115.0" y="643" text-anchor="middle">gets key presses</text>
    <text class="s" x="115.0" y="657" text-anchor="middle">and pointer moves</text>
  </g>
  <g>
    <rect class="part" x="775" y="548" width="140" height="44" rx="6"/>
    <text class="p mono" x="845.0" y="567" text-anchor="middle">kvm.py</text>
    <text class="s" x="845.0" y="581" text-anchor="middle">writes to the COM port</text>
  </g>
  <g class="off">
    <rect class="part" x="775" y="624" width="140" height="44" rx="6"/>
    <text class="p" x="845.0" y="643" text-anchor="middle">gets key presses</text>
    <text class="s" x="845.0" y="657" text-anchor="middle">and pointer moves</text>
  </g>
  <rect class="board" x="270" y="498" width="180" height="190" rx="10"/>
  <text class="h" x="360" y="524" text-anchor="middle">Board A</text>
  <rect class="board" x="510" y="498" width="180" height="190" rx="10"/>
  <text class="h" x="600" y="524" text-anchor="middle">Board B</text>
  <g class="off">
    <rect class="part" x="277" y="548" width="110" height="44" rx="6"/>
    <text class="p" x="332.0" y="574" text-anchor="middle">USB serial port</text>
  </g>
  <g>
    <rect class="part" x="277" y="624" width="110" height="44" rx="6"/>
    <text class="p" x="332.0" y="643" text-anchor="middle">USB keyboard</text>
    <text class="p" x="332.0" y="657" text-anchor="middle">and pointer</text>
  </g>
  <g>
    <rect class="part" x="573" y="548" width="110" height="44" rx="6"/>
    <text class="p" x="628.0" y="574" text-anchor="middle">USB serial port</text>
  </g>
  <g class="off">
    <rect class="part" x="573" y="624" width="110" height="44" rx="6"/>
    <text class="p" x="628.0" y="643" text-anchor="middle">USB keyboard</text>
    <text class="p" x="628.0" y="657" text-anchor="middle">and pointer</text>
  </g>
  <text class="s" x="235" y="612" text-anchor="middle">USB</text>
  <text class="s" x="725" y="612" text-anchor="middle">USB</text>
  <text class="s" x="480" y="604" text-anchor="middle">solder</text>
  <text class="s" x="480" y="617" text-anchor="middle">joints</text>
  <text class="pin" x="441" y="560" text-anchor="end">GP9 in</text>
  <text class="pin" x="441" y="664" text-anchor="end">GP13 out</text>
  <text class="pin" x="519" y="560">GP13 out</text>
  <text class="pin" x="519" y="664">GP9 in</text>
  <path class="cmd" d="M773 582H685" marker-end="url(#c)"/>
  <path class="cmd" d="M573 570H425V634H389" marker-end="url(#c)"/>
  <path class="cmd" d="M277 646H189" marker-end="url(#c)"/>
  <path class="ans" d="M387 646H540V582H571" marker-end="url(#r)"/>
  <path class="ans" d="M683 560H771" marker-end="url(#r)"/>
  <path d="M450 674Q480 686 510 674" fill="none" stroke="#d0d7de" stroke-width="3" stroke-linecap="round"/>
  <circle cx="450" cy="674" r="4.5" fill="#ffd866" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="510" cy="674" r="4.5" fill="#ffd866" stroke="#ffffff" stroke-width="1.2"/>
  <text class="s" x="480" y="668" text-anchor="middle" fill="#c9d1d9">GND wire</text>
  <rect class="pad" x="444" y="564" width="12" height="12" rx="3"/>
  <rect class="pad" x="444" y="640" width="12" height="12" rx="3"/>
  <rect class="pad" x="504" y="564" width="12" height="12" rx="3"/>
  <rect class="pad" x="504" y="640" width="12" height="12" rx="3"/>
  <line x1="60" y1="708" x2="900" y2="708" stroke="#21262d"/>
  <text x="60" y="730" font-size="12.5">Both joints and the ground jumper wire are used in both cases, and both directions can run at once. A board tells the lines apart by how they start:</text>
  <text x="60" y="752" font-size="12.5" class="dim"><tspan class="mono" fill="#4cc38a" font-weight="700">+</tspan> or <tspan class="mono" fill="#4cc38a" font-weight="700">-</tspan> is an answer and goes to the serial port; anything else is a command for the keyboard and pointer. Every line ends in a checksum.</text>
</svg>
