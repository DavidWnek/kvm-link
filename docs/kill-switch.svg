<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">The kill switch on the touch panel</title>
  <desc id="d">Two states of the panel. Green, CONTROL ON: touching the screen anywhere stops control at once. Red, STOPPED: holding a finger on the screen for one second allows control again, and nothing on the PC can do that.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .dim { fill: #8b949e; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    .big { font-size: 40px; font-weight: 700; fill: #ffffff; }
    .hint { font-size: 15px; fill: #ffffff; }
    .st { font-size: 12.5px; }
  </style>

  <rect x="0.5" y="0.5" width="959" height="399" rx="12" fill="#0d1117" stroke="#30363d"/>

  <!-- on -->
  <rect x="50" y="40" width="400" height="272" rx="12" fill="#1c2128" stroke="#444c56"/>
  <rect x="66" y="56" width="368" height="144" fill="#14823c"/>
  <rect x="66" y="200" width="368" height="96" fill="#0e1016"/>
  <text x="250" y="130" text-anchor="middle" class="mono big">CONTROL ON</text>
  <text x="250" y="164" text-anchor="middle" class="mono hint">touch anywhere to stop</text>
  <text x="78" y="222" class="mono st">Keyboard board: connected, TX43 RX44</text>
  <text x="78" y="242" class="mono st">Other computer: ready</text>
  <text x="78" y="262" class="mono st dim">Passed 1284   blocked 0</text>
  <text x="78" y="282" class="mono st dim">Last: K 00 04</text>
  <text x="250" y="344" font-size="14" font-weight="700" text-anchor="middle">Touch anywhere to stop</text>
  <text x="250" y="366" font-size="12.5" text-anchor="middle" class="dim">Control stops at once and every held key is released.</text>

  <!-- off -->
  <rect x="510" y="40" width="400" height="272" rx="12" fill="#1c2128" stroke="#444c56"/>
  <rect x="526" y="56" width="368" height="144" fill="#b91e1e"/>
  <rect x="526" y="188" width="150" height="12" fill="#ffffff"/>
  <rect x="526" y="200" width="368" height="96" fill="#0e1016"/>
  <text x="710" y="130" text-anchor="middle" class="mono big">STOPPED</text>
  <text x="710" y="164" text-anchor="middle" class="mono hint">hold anywhere to allow control</text>
  <text x="538" y="222" class="mono st">Keyboard board: connected, TX43 RX44</text>
  <text x="538" y="242" class="mono st">Other computer: ready</text>
  <text x="538" y="262" class="mono st dim">Passed 1284   blocked 3</text>
  <text x="538" y="282" class="mono st dim">Last: M 00 4008 400F 00</text>
  <text x="710" y="344" font-size="14" font-weight="700" text-anchor="middle">Hold for a second to allow control again</text>
  <text x="710" y="366" font-size="12.5" text-anchor="middle" class="dim">Only a finger can do this. Nothing on the PC can switch it back on.</text>
</svg>
