<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="t d">
  <title id="t">kvm-link overview</title>
  <desc id="d">The controlling PC sends keys and pointer moves with kvm.py over USB serial to an RP2350 bridge board, which passes them over three wires to a second RP2350 that the target computer sees as a USB keyboard and pointer. The target's HDMI output goes to a capture card on the controlling PC, where grab.ps1 saves stills.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#bc8cff"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .dim { fill: #8b949e; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    .box { fill: #161b22; stroke: #444c56; }
    .h { font-size: 14px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #8b949e; }
    .lbl { font-size: 11.5px; fill: #c9d1d9; }
  </style>

  <rect x="0.5" y="0.5" width="959" height="339" rx="12" fill="#0d1117" stroke="#30363d"/>

  <!-- path names -->
  <text x="480" y="46" font-size="13" text-anchor="middle" fill="#58a6ff"><tspan class="mono" font-weight="700">kvm.py</tspan> · keys and pointer go out</text>
  <text x="480" y="306" font-size="13" text-anchor="middle" fill="#bc8cff"><tspan class="mono" font-weight="700">grab.ps1</tspan> · the screen comes back</text>

  <!-- this PC -->
  <rect class="box" x="40" y="80" width="160" height="190" rx="10"/>
  <text class="h" x="120" y="168" text-anchor="middle">This PC</text>
  <text class="s" x="120" y="187" text-anchor="middle">runs the two scripts</text>

  <!-- target -->
  <rect class="box" x="760" y="80" width="160" height="190" rx="10"/>
  <text class="h" x="840" y="168" text-anchor="middle">Target computer</text>
  <text class="s" x="840" y="187" text-anchor="middle">needs no software</text>

  <!-- bridge -->
  <rect class="box" x="280" y="76" width="160" height="78" rx="10"/>
  <text class="h" x="360" y="106" text-anchor="middle">RP2350 bridge</text>
  <text class="s" x="360" y="124" text-anchor="middle">a serial port</text>
  <text class="s" x="360" y="140" text-anchor="middle">on this PC</text>

  <!-- target board -->
  <rect class="box" x="520" y="76" width="160" height="78" rx="10"/>
  <text class="h" x="600" y="106" text-anchor="middle">RP2350 target board</text>
  <text class="s" x="600" y="124" text-anchor="middle">USB keyboard</text>
  <text class="s" x="600" y="140" text-anchor="middle">and absolute pointer</text>

  <!-- capture card -->
  <rect class="box" x="400" y="200" width="160" height="66" rx="10"/>
  <text class="h" x="480" y="229" text-anchor="middle">HDMI capture card</text>
  <text class="s" x="480" y="247" text-anchor="middle">seen as a camera</text>

  <!-- top path -->
  <path d="M200 115H278" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#a1)"/>
  <path d="M440 115H518" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#a1)"/>
  <path d="M680 115H758" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#a1)"/>
  <text class="lbl" x="240" y="106" text-anchor="middle">USB serial</text>
  <text class="lbl" x="480" y="106" text-anchor="middle">3 wires</text>
  <text class="lbl" x="720" y="106" text-anchor="middle">USB</text>

  <!-- bottom path -->
  <path d="M760 233H562" fill="none" stroke="#bc8cff" stroke-width="2.5" marker-end="url(#a2)"/>
  <path d="M400 233H202" fill="none" stroke="#bc8cff" stroke-width="2.5" marker-end="url(#a2)"/>
  <text class="lbl" x="660" y="224" text-anchor="middle">HDMI</text>
  <text class="lbl" x="300" y="224" text-anchor="middle">USB</text>
</svg>
