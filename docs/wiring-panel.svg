<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t d">
  <title id="t">kvm-link wiring</title>
  <desc id="d">Three wires join the P1 socket of the ESP32-S3 touch panel to a Waveshare RP2350-Zero: panel GND to GND, panel TX (IO43) to GP1, panel RX (IO44) to GP0. The socket's 5V pin is left unconnected. The panel's USB goes to the controlling PC and the RP2350's USB goes to the target computer.</desc>
  <defs>
    <marker id="aTx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5b942"/></marker>
    <marker id="aRx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4cc38a"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .dim { fill: #8b949e; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    .pad { fill: #b08d2e; }
    .padon { fill: #ffd866; stroke: #ffffff; stroke-width: 1.5; }
    .pin { font-size: 10px; fill: #9db0e8; }
    .pinon { font-size: 10.5px; font-weight: 700; fill: #ffffff; }
    .wire { fill: none; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <rect x="0.5" y="0.5" width="959" height="619" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="50" font-size="20" font-weight="700">Wiring with the touch panel</text>
  <text x="60" y="74" font-size="13" class="dim">Three wires from the panel's P1 socket to the RP2350-Zero.</text>

  <!-- ESP32 touch panel -->
  <text x="60" y="112" font-size="14" font-weight="700">ESP32-S3 touch panel</text>
  <text x="60" y="130" font-size="12" class="dim">Guition JC3248W535C · bridge and kill switch</text>
  <rect x="60" y="140" width="270" height="240" rx="10" fill="#1c2128" stroke="#444c56"/>
  <rect x="74" y="154" width="230" height="127" fill="#14823c"/>
  <rect x="74" y="281" width="230" height="85" fill="#0e1016"/>
  <text x="189" y="218" font-size="26" font-weight="700" text-anchor="middle" class="mono" fill="#ffffff">CONTROL ON</text>
  <text x="189" y="244" font-size="11" text-anchor="middle" class="mono" fill="#ffffff">touch anywhere to stop</text>
  <text x="82" y="298" font-size="9" class="mono">Keyboard board: connected, TX43 RX44</text>
  <text x="82" y="314" font-size="9" class="mono">Other computer: ready</text>
  <text x="82" y="330" font-size="9" class="mono dim">Passed 1284   blocked 0</text>
  <text x="82" y="346" font-size="9" class="mono dim">Last: K 00 04</text>

  <!-- panel USB -->
  <rect x="236" y="374" width="44" height="14" rx="4" fill="#c9ced6" stroke="#8b949e"/>
  <path d="M258 388V420H166" fill="none" stroke="#6e7681" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="425" font-size="13" font-weight="700">USB to this PC</text>

  <!-- P1 socket -->
  <text x="337" y="162" font-size="10" text-anchor="middle" class="dim">P1</text>
  <rect x="322" y="168" width="30" height="184" rx="3" fill="#e8e3d3" stroke="#b8b29f"/>
  <circle cx="340" cy="188" r="5" fill="#6e7681"/>
  <circle cx="340" cy="236" r="5" fill="#6e7681"/>
  <circle cx="340" cy="284" r="5" fill="#6e7681"/>
  <circle cx="340" cy="332" r="5" fill="#6e7681"/>

  <!-- wires -->
  <path class="wire" d="M352 188H634" stroke="#d0d7de"/>
  <path class="wire" d="M352 236H520V440H850V188H790" stroke="#f5b942" marker-end="url(#aTx)"/>
  <path class="wire" d="M786 160H878V468H495V284H358" stroke="#4cc38a" marker-end="url(#aRx)"/>
  <path class="wire" d="M352 332H384" stroke="#f85149"/>
  <path d="M388 326l12 12M400 326l-12 12" stroke="#f85149" stroke-width="2.5" stroke-linecap="round"/>

  <text x="376" y="181" font-size="12" font-weight="700">GND</text>
  <text x="376" y="229" font-size="12" font-weight="700" fill="#f5b942">TX <tspan class="dim" font-weight="400">· IO43</tspan></text>
  <text x="376" y="277" font-size="12" font-weight="700" fill="#4cc38a">RX <tspan class="dim" font-weight="400">· IO44</tspan></text>
  <text x="376" y="322" font-size="12" font-weight="700" fill="#f85149">5V</text>
  <text x="408" y="336" font-size="11" class="dim">not connected</text>

  <text x="690" y="434" font-size="11" text-anchor="middle" fill="#f5b942">panel TX → GP1</text>
  <text x="690" y="462" font-size="11" text-anchor="middle" fill="#4cc38a">GP0 → panel RX</text>

  <!-- RP2350-Zero -->
  <path d="M710 116V80" fill="none" stroke="#6e7681" stroke-width="6" stroke-linecap="round"/>
  <text x="724" y="90" font-size="13" font-weight="700">USB to the target computer</text>
  <text x="724" y="107" font-size="12" class="dim">also powers the board</text>
  <rect x="640" y="128" width="140" height="284" rx="8" fill="#1f3a8a" stroke="#3b5bbd"/>
  <rect x="686" y="114" width="48" height="40" rx="5" fill="#c9ced6" stroke="#8b949e"/>
  <rect x="694" y="119" width="32" height="7" rx="3" fill="#30363d"/>

  <rect x="690" y="208" width="14" height="14" rx="3" fill="#e5e7eb"/>
  <rect x="716" y="208" width="14" height="14" rx="3" fill="#e5e7eb"/>
  <text x="697" y="203" font-size="7" text-anchor="middle" fill="#c7d2fe">BOOT</text>
  <text x="723" y="203" font-size="7" text-anchor="middle" fill="#c7d2fe">RUN</text>
  <rect x="692" y="262" width="36" height="36" rx="3" fill="#111827" stroke="#374151"/>
  <text x="710" y="283" font-size="7" text-anchor="middle" fill="#9ca3af">RP2350</text>

  <!-- left pads, top to bottom -->
  <rect class="pad" x="634" y="154" width="12" height="12" rx="3"/><text class="pin" x="652" y="164">5V</text>
  <rect class="padon" x="634" y="182" width="12" height="12" rx="3"/><text class="pinon" x="652" y="192">GND</text>
  <rect class="pad" x="634" y="210" width="12" height="12" rx="3"/><text class="pin" x="652" y="220">3V3</text>
  <rect class="pad" x="634" y="238" width="12" height="12" rx="3"/><text class="pin" x="652" y="248">GP29</text>
  <rect class="pad" x="634" y="266" width="12" height="12" rx="3"/><text class="pin" x="652" y="276">GP28</text>
  <rect class="pad" x="634" y="294" width="12" height="12" rx="3"/><text class="pin" x="652" y="304">GP27</text>
  <rect class="pad" x="634" y="322" width="12" height="12" rx="3"/><text class="pin" x="652" y="332">GP26</text>
  <rect class="pad" x="634" y="350" width="12" height="12" rx="3"/><text class="pin" x="652" y="360">GP15</text>
  <rect class="pad" x="634" y="378" width="12" height="12" rx="3"/><text class="pin" x="652" y="388">GP14</text>

  <!-- right pads, top to bottom -->
  <rect class="padon" x="774" y="154" width="12" height="12" rx="3"/><text class="pinon" x="768" y="164" text-anchor="end">GP0</text>
  <rect class="padon" x="774" y="182" width="12" height="12" rx="3"/><text class="pinon" x="768" y="192" text-anchor="end">GP1</text>
  <rect class="pad" x="774" y="210" width="12" height="12" rx="3"/><text class="pin" x="768" y="220" text-anchor="end">GP2</text>
  <rect class="pad" x="774" y="238" width="12" height="12" rx="3"/><text class="pin" x="768" y="248" text-anchor="end">GP3</text>
  <rect class="pad" x="774" y="266" width="12" height="12" rx="3"/><text class="pin" x="768" y="276" text-anchor="end">GP4</text>
  <rect class="pad" x="774" y="294" width="12" height="12" rx="3"/><text class="pin" x="768" y="304" text-anchor="end">GP5</text>
  <rect class="pad" x="774" y="322" width="12" height="12" rx="3"/><text class="pin" x="768" y="332" text-anchor="end">GP6</text>
  <rect class="pad" x="774" y="350" width="12" height="12" rx="3"/><text class="pin" x="768" y="360" text-anchor="end">GP7</text>
  <rect class="pad" x="774" y="378" width="12" height="12" rx="3"/><text class="pin" x="768" y="388" text-anchor="end">GP8</text>

  <!-- bottom pads GP13..GP9 -->
  <rect class="pad" x="648" y="406" width="12" height="12" rx="3"/>
  <rect class="pad" x="676" y="406" width="12" height="12" rx="3"/>
  <rect class="pad" x="704" y="406" width="12" height="12" rx="3"/>
  <rect class="pad" x="732" y="406" width="12" height="12" rx="3"/>
  <rect class="pad" x="760" y="406" width="12" height="12" rx="3"/>

  <text x="796" y="153" font-size="10" class="dim">UART TX</text>
  <text x="796" y="181" font-size="10" class="dim">UART RX</text>

  <text x="710" y="502" font-size="14" font-weight="700" text-anchor="middle">Waveshare RP2350-Zero</text>
  <text x="710" y="520" font-size="12" text-anchor="middle" class="dim">top view, USB-C at the top · the keyboard side</text>

  <!-- notes -->
  <line x1="60" y1="540" x2="900" y2="540" stroke="#21262d"/>
  <text x="60" y="562" font-size="12.5"><tspan fill="#f85149" font-weight="700">5V</tspan> stays unconnected: the RP2350 is powered by the target computer, and joining the supplies would tie the two computers together.</text>
  <text x="60" y="582" font-size="12.5"><tspan fill="#f5b942" font-weight="700">TX</tspan> and <tspan fill="#4cc38a" font-weight="700">RX</tspan> may be swapped: the panel listens on whichever pin the RP2350 drives, and shows the pins it settled on.</text>
  <text x="60" y="602" font-size="12.5" class="dim">Go by the labels printed beside the socket; the order of its pins on the board may differ from this drawing.</text>
</svg>
