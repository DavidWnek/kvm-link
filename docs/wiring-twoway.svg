<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 738" width="960" height="738" role="img" aria-labelledby="t d">
  <title id="t">kvm-link two-way pair: how the two RP2350 boards are joined</title>
  <desc id="d">Two Waveshare RP2350-Zero boards lie end to end, both face up, with their USB sockets pointing away from each other. The five pads on the end of one board are soldered to the five they meet on the other. Board A GP9 meets board B GP13, and board A GP13 meets board B GP9: those two corner joints are the link, GP13 sending and GP9 receiving on each board. The three joints between them, GP10 to GP12, GP11 to GP11 and GP12 to GP10, carry nothing. A separate jumper wire joins the GND pad of one board to the GND pad of the other.</desc>
