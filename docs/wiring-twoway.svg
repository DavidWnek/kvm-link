  <line x1="60" y1="642" x2="900" y2="642" stroke="#21262d"/>
  <text x="60" y="664" font-size="12.5">Each board sends on <tspan fill="#ffffff" font-weight="700">GP13</tspan> and receives on <tspan fill="#ffffff" font-weight="700">GP9</tspan>; turned half round, one board's GP13 lands on the other's GP9. No joint may touch its neighbour.</text>
  <text x="60" y="686" font-size="12.5" class="dim">There is no ground on that edge, so GND needs its own jumper wire. Leave 5V and 3V3 alone: each board is powered by its own computer.</text>
  <text x="60" y="708" font-size="12.5" class="dim">Boards shown: Waveshare RP2350-Zero, top view.</text>
