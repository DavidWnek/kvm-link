; kvm-link bridge on an ESP32-S3 touchscreen panel, with an on-screen kill switch.
;
;   python -m platformio run -e jc3248w535 -t upload --upload-port COM7
;
; KVM_LINK_RX / KVM_LINK_TX are the two GPIOs wired to the RP2350 target board.
; ARDUINO_USB_CDC_ON_BOOT says where the PC talks to the panel: 1 when the USB-C port is the
; ESP32-S3's own USB, 0 when it goes through a serial chip (CH340) on UART0.

[platformio]
default_envs = jc3248w535

[env]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -I include
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
; Octal PSRAM (ESP32-S3R8). Flash is declared as 4 MB, which is right or conservative for
; every board here and all this firmware needs.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv

; Guition JC3248W535C (3.5", 320x480, AXS15231B with built-in capacitive touch, native USB).
; The firmware looks for the link on the TX/RX pins of the P1 socket (IO43 / IO44) and on
; IO17 / IO18 (P3 and P4), either way round; the pins below are only where it starts.
[env:jc3248w535]
build_flags = ${env.build_flags} -D BOARD_JC3248W535 -D ARDUINO_USB_CDC_ON_BOOT=1
    -D KVM_LINK_TX=17 -D KVM_LINK_RX=18

; ---- RGB panels with GT911 touch and a CH340 USB serial chip (include/boards) ---------------

[remote_panel]
build_flags = ${env.build_flags} -D ARDUINO_USB_CDC_ON_BOOT=0

; Elecrow CrowPanel Advance 7.0. The link is the UART1-OUT port (RX IO19, TX IO20 per
; Elecrow's wiki); the function switch on the back must be at "0 1" (wireless module),
; which is the position that routes IO19/IO20 to that port instead of the microphone.
[env:crow70]
build_flags = ${remote_panel.build_flags} -D BOARD_CROWPANEL_ADVANCE_70 -D CROW_LEAVE_GPIO19_ALONE
    -D KVM_LINK_RX=19 -D KVM_LINK_TX=20

; The panels below break IO17 and IO18 out on a 4-pin header. Those two pins are from
; memory of the boards, not checked against a schematic: confirm before wiring.
[env:jc8048w550]
build_flags = ${remote_panel.build_flags} -D BOARD_JC8048W550 -D KVM_LINK_RX=18 -D KVM_LINK_TX=17

[env:s8048s070]
build_flags = ${remote_panel.build_flags} -D BOARD_SUNTON_8048S070 -D KVM_LINK_RX=18 -D KVM_LINK_TX=17

[env:s8048s050]
build_flags = ${remote_panel.build_flags} -D BOARD_SUNTON_8048S050 -D KVM_LINK_RX=18 -D KVM_LINK_TX=17
